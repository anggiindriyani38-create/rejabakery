<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator — Toko Roti Lezat</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8B4513">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-icon">🍞</div>
        <h2>Login Administrator</h2>
        <p class="sub-login">Toko Roti Lezat — Sistem Admin</p>
        
        <form id="form-login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <div class="pesan-error" id="pesan-error"></div>
            <button type="submit" class="btn-login-full">MASUK</button>
        </form>
        
        <p class="link-kembali"><a href="index.html">← Kembali ke Beranda</a></p>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
